<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#050509" />
    <title>Epic Music Space</title>
    <style>
      :root { color-scheme: dark; }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 30% 20%, #1f4bd8 0%, #050509 55%, #000 100%);
        color: #f5f6ff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, sans-serif;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      }

      main {
        max-width: 22rem;
        padding: 2rem 1.5rem;
        text-align: center;
      }

      .logo {
        width: 64px;
        height: 64px;
        margin: 0 auto 1.25rem;
        border-radius: 16px;
        background: rgba(31,75,216,0.2);
        border: 1px solid rgba(31,75,216,0.35);
        display: grid;
        place-items: center;
      }

      .logo svg { width: 32px; height: 32px; color: #87a7ff; fill: currentColor; }

      h1 {
        font-size: 1.35rem;
        font-weight: 800;
        letter-spacing: -0.01em;
        background: linear-gradient(135deg, #87a7ff 0%, #c084fc 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-bottom: 0.75rem;
      }

      p {
        color: rgba(245,246,255,0.55);
        line-height: 1.6;
        font-size: 0.9rem;
        margin-bottom: 1.5rem;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        padding: 0.75rem 1.5rem;
        border-radius: 10px;
        font-size: 0.9rem;
        font-weight: 700;
        text-decoration: none;
        cursor: pointer;
        border: none;
        transition: opacity 0.15s;
      }
      .btn:active { opacity: 0.8; }

      .btn-primary {
        background: #1f4bd8;
        color: #fff;
        width: 100%;
        justify-content: center;
        margin-bottom: 0.75rem;
      }

      .btn-ghost {
        background: rgba(255,255,255,0.08);
        color: rgba(245,246,255,0.7);
        font-size: 0.8rem;
        padding: 0.5rem 1rem;
      }

      .status {
        margin-top: 1.25rem;
        font-size: 0.75rem;
        color: rgba(245,246,255,0.3);
        min-height: 1.2em;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 0.3rem;
        font-size: 0.72rem;
        font-weight: 600;
        padding: 0.25rem 0.6rem;
        border-radius: 999px;
        margin-bottom: 1rem;
      }
      .badge-maintenance {
        background: rgba(234,179,8,0.15);
        color: #fbbf24;
        border: 1px solid rgba(234,179,8,0.3);
      }
      .badge-offline {
        background: rgba(239,68,68,0.15);
        color: #f87171;
        border: 1px solid rgba(239,68,68,0.3);
      }

      .countdown {
        font-size: 0.78rem;
        color: rgba(245,246,255,0.35);
        margin-top: 0.5rem;
      }

      @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
      .loading { animation: pulse 1.4s ease-in-out infinite; }
      .hidden { display: none; }
    </style>
  </head>
  <body>
    <main>
      <div class="logo">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h6V3h-8Z"/></svg>
      </div>
      <h1>Epic Music Space</h1>

      <div id="badge-maintenance" class="badge badge-maintenance hidden">⚙ Scheduled Maintenance</div>
      <div id="badge-offline" class="badge badge-offline">✕ No Connection</div>

      <p id="msg">Can't reach the platform.<br>Check your internet connection and try again.</p>

      <button class="btn btn-primary" id="retryBtn" onclick="manualRetry()">
        &#8635; Retry Connection
      </button>
      <a href="https://epicmusicspace.com" class="btn btn-ghost">Open in browser</a>

      <p class="status" id="status"></p>
      <p class="countdown hidden" id="countdown"></p>
    </main>

    <script>
      const HEALTH_URL = 'https://epicmusicspace.com/api/health';
      let attempts = 0;
      let autoTimer = null;
      let countdownTimer = null;
      // Exponential backoff: 8s, 16s, 32s, max 60s
      let backoffMs = 8000;

      function setStatus(msg) {
        document.getElementById('status').textContent = msg;
      }

      function showMaintenance() {
        document.getElementById('badge-maintenance').classList.remove('hidden');
        document.getElementById('badge-offline').classList.add('hidden');
        document.getElementById('msg').textContent =
          'We\'re doing a quick update to make Epic Music Space even better. Hang tight — we\'ll be back shortly.';
        document.getElementById('retryBtn').textContent = '↻ Check Again';
      }

      function showOffline() {
        document.getElementById('badge-maintenance').classList.add('hidden');
        document.getElementById('badge-offline').classList.remove('hidden');
        document.getElementById('msg').textContent =
          'Can\'t reach the platform.\nCheck your internet connection and try again.';
        document.getElementById('retryBtn').textContent = '↻ Retry Connection';
      }

      function startCountdown(seconds) {
        const el = document.getElementById('countdown');
        el.classList.remove('hidden');
        let remaining = seconds;
        clearInterval(countdownTimer);
        countdownTimer = setInterval(() => {
          remaining -= 1;
          if (remaining <= 0) {
            clearInterval(countdownTimer);
            el.classList.add('hidden');
          } else {
            el.textContent = 'Auto-retry in ' + remaining + 's…';
          }
        }, 1000);
      }

      async function check() {
        attempts++;
        setStatus('Checking connection…');
        document.getElementById('retryBtn').classList.add('loading');
        document.getElementById('countdown').classList.add('hidden');
        clearInterval(countdownTimer);

        try {
          const res = await fetch(HEALTH_URL, {
            method: 'HEAD',
            cache: 'no-store',
            signal: AbortSignal.timeout(8000),
          });

          if (res.ok) {
            setStatus('Connected! Loading…');
            window.location.href = 'https://epicmusicspace.com';
            return;
          }

          if (res.status === 503) {
            showMaintenance();
            setStatus('Maintenance in progress (attempt ' + attempts + ').');
          } else {
            showOffline();
            setStatus('Server error ' + res.status + ' (attempt ' + attempts + ').');
          }
        } catch {
          showOffline();
          setStatus('Still offline (attempt ' + attempts + ').');
        }

        document.getElementById('retryBtn').classList.remove('loading');

        // Schedule next auto-retry with exponential backoff (max 60s).
        clearTimeout(autoTimer);
        const wait = Math.min(backoffMs, 60000);
        backoffMs = Math.min(backoffMs * 2, 60000);
        startCountdown(Math.round(wait / 1000));
        autoTimer = setTimeout(check, wait);
      }

      function manualRetry() {
        // Reset backoff on manual tap.
        backoffMs = 8000;
        clearTimeout(autoTimer);
        check();
      }

      // Resume from background → immediate retry.
      document.addEventListener('resume', () => {
        clearTimeout(autoTimer);
        backoffMs = 8000;
        check();
      }, { once: false });

      // Try immediately on load.
      window.addEventListener('load', () => setTimeout(check, 800));
    </script>
  </body>
</html>
