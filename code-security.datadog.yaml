schema-version: v1.0
sast:
  use-default-rulesets: true
  ruleset-configs:
    jsx-react:
      ignore-paths:
        - "apps/web/src/components/AudioPlayer.tsx"
        - "apps/web/src/app/versus/[id]/VersusResultCard.tsx"
        - "apps/web/src/components/PostComposer.tsx"
        - "apps/web/src/app/**/opengraph-image.tsx"
        - "apps/web/src/app/dashboard/page.tsx"
        - "apps/web/src/components/VersusCard.tsx"
        - "apps/web/src/components/BattleRoyaleCard.tsx"
