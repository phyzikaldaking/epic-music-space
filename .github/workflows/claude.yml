name: Claude

on:
  # Trigger from GitHub UI: Actions → Claude → Run workflow
  workflow_dispatch:
    inputs:
      prompt:
        description: "What should Claude do? (e.g. 'fix the failing build', 'update DATABASE_URL handling')"
        required: true
        type: string

  # Trigger by mentioning @claude in any issue / PR / review comment
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    # Only run when @claude is mentioned, OR when triggered manually via workflow_dispatch
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))

    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write       # so Claude can commit and push fixes
      pull-requests: write  # so Claude can open PRs and reply
      issues: write         # so Claude can comment on issues
      id-token: write       # required by the action's OIDC

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so Claude can read git log

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Pass the workflow_dispatch input through as the prompt when triggered manually.
          # Ignored on @claude mention triggers.
          prompt: ${{ github.event.inputs.prompt }}
          # Allow Claude to use Bash for build/test/deploy commands.
          allowed_tools: "Bash,Read,Write,Edit,Glob,Grep"
