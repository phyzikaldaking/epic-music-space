name: Post-deploy smoke

# Runs after every successful Vercel production deployment to verify
# the live site responds correctly. Posts back a workflow failure if
# any check trips, so a deploy that "succeeded" but rendered broken
# pages still surfaces as red.
#
# Why this exists: we shipped a deploy with the Studio invisible in
# the nav and did not catch it for hours. This workflow would have
# failed within a minute of that deploy going Ready.

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Override target URL (default: production)"
        required: false
        default: "https://epicmusicspace.com"

jobs:
  smoke:
    # Only run on production deployments that just went Ready, or on
    # manual dispatch. Skip preview/staging environments and anything
    # in error/canceled state.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       (github.event.deployment.environment == 'Production' ||
        github.event.deployment.environment == 'production'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Resolve target URL
        id: target
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "url=${{ inputs.base_url }}" >> "$GITHUB_OUTPUT"
          else
            # The Vercel deployment_status payload sets target_url to the
            # specific deployment URL. Fall back to the production domain
            # so we always assert against what users will hit.
            echo "url=https://epicmusicspace.com" >> "$GITHUB_OUTPUT"
          fi

      - name: Run smoke
        id: smoke
        env:
          BASE_URL: ${{ steps.target.outputs.url }}
        run: node scripts/smoke.mjs "$BASE_URL"

      # Browser-based smoke. Catches the failure class an HTTP-only smoke
      # cannot: pages that 200 but never hydrate (CSP violation, runtime
      # error, broken dynamic import). Skips with exit 0 if Playwright is
      # not installed — the workflow is still useful with HTTP smoke alone.
      - name: Install Playwright Chromium
        run: npx --yes playwright@1.59.1 install chromium --with-deps

      - name: Run browser smoke
        id: smoke_browser
        env:
          BASE_URL: ${{ steps.target.outputs.url }}
        run: node scripts/smoke-browser.mjs "$BASE_URL"

      # If either smoke fails, page the on-call channel via the same
      # Slack/PD webhook the auth-alerts cron uses. A red GH Action tab
      # nobody's watching is the same as no alert — push to where humans
      # actually see notifications.
      - name: Notify on failure
        if: failure()
        env:
          AUTH_ALERT_WEBHOOK_URL: ${{ secrets.AUTH_ALERT_WEBHOOK_URL }}
          BASE_URL: ${{ steps.target.outputs.url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HTTP_RESULT: ${{ steps.smoke.outcome }}
          BROWSER_RESULT: ${{ steps.smoke_browser.outcome }}
        run: |
          if [[ -z "${AUTH_ALERT_WEBHOOK_URL:-}" ]]; then
            echo "::warning::AUTH_ALERT_WEBHOOK_URL not set; skipping alert push"
            exit 0
          fi
          curl -sS -X POST "${AUTH_ALERT_WEBHOOK_URL}" \
            -H "Content-Type: application/json" \
            -d "$(jq -nc \
              --arg target "$BASE_URL" \
              --arg run "$RUN_URL" \
              --arg sha "${GITHUB_SHA:0:7}" \
              --arg http "$HTTP_RESULT" \
              --arg browser "$BROWSER_RESULT" \
              '{
                text: ("🚨 *Post-deploy smoke FAILED* on " + $target + "\nCommit `" + $sha + "` — http=" + $http + " browser=" + $browser + "\n" + $run),
                severity: "error",
                fingerprint: "post-deploy-smoke",
                context: { target: $target, run: $run, sha: $sha, http: $http, browser: $browser }
              }')" \
            || echo "::warning::Webhook POST failed"
