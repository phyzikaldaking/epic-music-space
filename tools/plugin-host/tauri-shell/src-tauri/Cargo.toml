# System-tray wrapper around the plugin-host daemon. This is what
# producers actually download + double-click. The tray shows the
# connection state, version, and a "Reveal plugin folder" shortcut.
#
# The audio + websocket work happens inside the embedded
# `ems-plugin-host` library; this crate just owns the tray icon and
# spawns the servers on a tokio runtime when the app launches.

[package]
name = "ems-plugin-host-tauri"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "EMS Plugin Host — desktop tray app"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
ems-plugin-host = { path = "../../crates/ems-plugin-host" }
tauri = { version = "2.0", features = ["tray-icon"] }
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true

[features]
# Disable Tauri's default features to keep the binary tiny; we don't
# render an HTML view, only a tray.
default = []
